# Unified TanStack platform at app.buildingcultureid.space
# Upstream: docker compose stack (app/docker-compose.stack.yml) on APP_PORT (default 3011).

upstream bc_unified_app {
    server 127.0.0.1:3011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.buildingcultureid.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/app.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://bc_unified_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
