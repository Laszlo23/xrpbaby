# Published BC Studio community app — {slug}.buildingcultureid.space
# Point upstream to CreateOS deployment URL or static dist root after publish.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SLUG.buildingcultureid.space;

    # ssl_certificate /etc/letsencrypt/live/SLUG.buildingcultureid.space/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SLUG.buildingcultureid.space/privkey.pem;

    location / {
        # Replace with CreateOS deployment origin or /var/www/studio-SLUG
        proxy_pass https://YOUR_CREATEOS_DEPLOYMENT_URL;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
