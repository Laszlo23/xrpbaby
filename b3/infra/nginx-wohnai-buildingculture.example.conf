# WohnAI satellite — nginx reverse proxy to local Docker (realagent stack)
# Canonical URL: https://wohnai.buildingcultureid.space/
# Upstream: docker-compose.prod.yml maps host 127.0.0.1:3010 → app:3000
#
# Deploy app: ../../realagent/deploy/push-to-server.sh (or scripts/deploy-wohnai.sh)
# DNS: A wohnai.buildingcultureid.space → VPS (187.124.18.204)
# TLS: certbot certonly --nginx -d wohnai.buildingcultureid.space

server {
    listen 80;
    listen [::]:80;
    server_name wohnai.buildingcultureid.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wohnai.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/wohnai.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wohnai.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
