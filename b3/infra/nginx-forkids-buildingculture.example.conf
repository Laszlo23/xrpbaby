# KinderStimme (For Kids) satellite — reverse proxy (interim beta)
# Canonical URL: https://forkids.buildingcultureid.space/
# Upstream: kinderstimme.at (until native deploy from apps/behoerden/forkids on 127.0.0.1:3030)
#
# Uses resolver so nginx -t succeeds when upstream DNS is flaky at boot.
# DNS: A forkids.buildingcultureid.space → VPS
# TLS: certbot certonly --nginx -d forkids.buildingcultureid.space

server {
    listen 80;
    listen [::]:80;
    server_name forkids.buildingcultureid.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forkids.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/forkids.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forkids.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location / {
        set $forkids_upstream kinderstimme.at;
        proxy_pass https://$forkids_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host kinderstimme.at;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
