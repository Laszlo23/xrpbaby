# Places RWA app — proxy places.buildingcultureid.space to the Next.js container.
# Unified app (app.buildingcultureid.space) still serves canonical REOC at /places/api/reoc/*.
#
# Upstream (loopback — set PLACES_HOST_PORT in deploy, default 3013):
#   docker run -p 127.0.0.1:3013:3000 ogchain-web:latest

upstream bc_places_app {
    server 127.0.0.1:3013;
    keepalive 16;
}

# Add to the existing app.buildingcultureid.space server block, OR use map in the shared vhost:
#
# map $host $bc_backend {
#     places.buildingcultureid.space http://bc_places_app;
#     default                    http://bc_unified_app;
# }
#
# location / {
#     proxy_pass $bc_backend;
#     ...
# }
