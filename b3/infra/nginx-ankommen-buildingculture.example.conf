# Ankommen AI satellite — reverse proxy (interim beta)
# Canonical URL: https://ankommen.buildingcultureid.space/
# Upstream: ankommen.ai (until native deploy on BC subdomain)
#
# DNS: A/AAAA ankommen.buildingcultureid.space → nginx host
# TLS: certbot certonly --nginx -d ankommen.buildingcultureid.space
# Production: add host to CORS_ORIGIN + SIWE_ALLOWED_DOMAINS (deploy/.env)

upstream ankommen_prod {
    server ankommen.ai:443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ankommen.buildingcultureid.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ankommen.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/ankommen.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ankommen.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://ankommen_prod;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ankommen.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
