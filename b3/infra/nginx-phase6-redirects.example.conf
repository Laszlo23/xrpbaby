# Phase 6 — canonical redirects for mini hosts and legacy .capital domains
# Install on VPS: scripts/install-gtm-nginx.sh
# Verify: npm run smoke:production (canonical redirect checks)

# Apex /guide → home hub guide
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /guide {
        return 301 https://home.buildingcultureid.space/guide;
    }
}

# miniapp → forest quests
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miniapp.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/miniapp.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.buildingcultureid.space/forest/quests$is_args$args;
}

server {
    listen 80;
    listen [::]:80;
    server_name miniapp.buildingcultureid.space;
    return 301 https://app.buildingcultureid.space/forest/quests$is_args$args;
}

