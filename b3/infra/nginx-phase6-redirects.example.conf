# Legacy .capital → .buildingcultureid.space
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.buildingculture.capital 0x.buildingculture.capital buildingculture.capital;
    return 301 https://app.buildingcultureid.space$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name home.buildingculture.capital;
    return 301 https://home.buildingcultureid.space$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.buildingculture.capital 0x.buildingculture.capital buildingculture.capital home.buildingculture.capital;
    return 301 https://app.buildingcultureid.space$request_uri;
}
