# Redirect legacy art subdomain to unified app art route.
# HTTP — ACME challenges + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name art.buildingcultureid.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.buildingcultureid.space/drops/art$is_args$args;
    }
}

# HTTPS — permanent redirect to unified art experience
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name art.buildingcultureid.space;

    ssl_certificate /etc/letsencrypt/live/art.buildingcultureid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.buildingcultureid.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://app.buildingcultureid.space/drops/art$is_args$args;
    }
}
