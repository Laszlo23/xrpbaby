# Reference — redirect home.buildingcultureid.space → canonical unified app.
# Home marketing content is served from app.buildingcultureid.space/ (TanStack app).

server {
    listen 80;
    listen [::]:80;
    server_name home.buildingcultureid.space;
    return 301 https://app.buildingcultureid.space$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name home.buildingcultureid.space;

    # ssl_certificate /etc/letsencrypt/live/home.buildingcultureid.space/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/home.buildingcultureid.space/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://app.buildingcultureid.space$request_uri;
}
