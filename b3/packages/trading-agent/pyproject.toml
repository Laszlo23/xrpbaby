[project]
name = "bc-trading-agent"
version = "0.1.0"
description = "Building Culture trading agent — Aerodrome/Velodrome quotes via sugar-sdk (Base)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "git+https://github.com/velodrome-finance/sugar-sdk.git@v0.4.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
bc-trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: hits live Base RPC via sugar-sdk"]
