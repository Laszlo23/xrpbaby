services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ankommen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ankommen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ankommen}
      POSTGRES_DB: ankommen
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankommen -d ankommen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ankommen-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ankommen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-ankommen-documents};
      exit 0;
      "

  austria-chain:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: ankommen-austria-chain
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "7777777", "--block-time", "2"]
    ports:
      - "8545:8545"
    volumes:
      - austria_chain_data:/root/.anvil

volumes:
  postgres_data:
  redis_data:
  minio_data:
  austria_chain_data:
